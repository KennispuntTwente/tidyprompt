name: Optional ellmer development compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  ellmer-devel:
    # Manual runs always work; scheduled runs require this repository variable.
    if: github.event_name == 'workflow_dispatch' || vars.ELLMER_DEVEL_CHECK == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
      OPENAI_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: github::tidyverse/ellmer
          needs: check
      - name: Test ellmer protocol and composition contracts
        shell: Rscript {0}
        run: |
          options(lifecycle_verbosity = "error")
          print(packageDescription("ellmer")[c("Version", "RemoteSha")])
          testthat::test_local(
            filter = "ellmer|answer_as_dataframe|evaluation_composition",
            stop_on_failure = TRUE
          )
