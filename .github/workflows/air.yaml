name: air-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  air-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.11.0"
      - run: air format --check .
